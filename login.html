<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đăng nhập quản lý | Hồng Ngọc Travel</title><link rel="icon" href="./favicon.svg"><link rel="stylesheet" href="./css/style.css"><script type="module" src="./js/login.js"></script></head><body>
<main class="admin-login"><section class="login-brand"><img src="./logo.png" alt="Hồng Ngọc Travel"><p class="kicker">KHÔNG GIAN QUẢN LÝ</p><h1>Mỗi hành trình.<br>Một trải nghiệm trọn vẹn.</h1><p>Quản lý đặt chỗ, kiểm tra lịch xe và đồng hành cùng khách hàng.</p></section><section class="login-form-wrap"><h2>Chào mừng trở lại</h2><p>Đăng nhập để quản lý Hồng Ngọc Travel.</p><form class="lookup-form" id="login-form"><label>Tên đăng nhập<input name="username" autocomplete="username" required minlength="3" maxlength="40"></label><label>Mật khẩu<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label><p class="form-error" role="alert" id="login-error" hidden></p><button class="button" type="submit">Đăng nhập →</button></form><a class="text-link" href="./">← Về trang chủ</a></section></main></body></html>
